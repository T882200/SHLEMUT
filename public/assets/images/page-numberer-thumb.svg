<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <rect width="800" height="600" fill="#FFF7ED"/>
  <!-- Page icons -->
  <rect x="250" y="120" width="120" height="170" rx="4" fill="white" stroke="#D97706" stroke-width="1.5"/>
  <text x="310" y="265" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#D97706" text-anchor="middle">1</text>
  <rect x="340" y="140" width="120" height="170" rx="4" fill="white" stroke="#D97706" stroke-width="1.5"/>
  <text x="400" y="285" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#D97706" text-anchor="middle">2</text>
  <rect x="430" y="160" width="120" height="170" rx="4" fill="white" stroke="#D97706" stroke-width="1.5"/>
  <text x="490" y="305" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#D97706" text-anchor="middle">3</text>
  <!-- Lines on pages -->
  <line x1="265" y1="145" x2="355" y2="145" stroke="#E7E5E4" stroke-width="2"/>
  <line x1="265" y1="160" x2="340" y2="160" stroke="#E7E5E4" stroke-width="2"/>
  <line x1="265" y1="175" x2="350" y2="175" stroke="#E7E5E4" stroke-width="2"/>
  <text x="400" y="420" font-family="system-ui, sans-serif" font-size="22" font-weight="600" fill="#1C1917" text-anchor="middle">PageNumberer Pro</text>
  <text x="400" y="455" font-family="system-ui, sans-serif" font-size="16" fill="#78716C" text-anchor="middle">Automated page numbering for InDesign</text>
</svg>
