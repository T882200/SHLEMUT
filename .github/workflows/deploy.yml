name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate product data
        run: |
          echo "Validating product content files..."
          for file in src/content/products/*.md; do
            if [ -f "$file" ]; then
              # Check required frontmatter fields exist
              if ! grep -q "^title:" "$file" 2>/dev/null; then
                echo "ERROR: Missing title in $file"
                exit 1
              fi
              if ! grep -q "^slug:" "$file" 2>/dev/null; then
                echo "ERROR: Missing slug in $file"
                exit 1
              fi
              if ! grep -q "^price:" "$file" 2>/dev/null; then
                echo "ERROR: Missing price in $file"
                exit 1
              fi
              echo "✓ $file"
            fi
          done
          echo "All product files valid."

      - name: Build Astro site
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
